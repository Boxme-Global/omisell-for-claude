name: check

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: House rules in sync, frontmatter valid
        run: python3 scripts/skills.py check
      - name: JSON manifests parse
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/omisell/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/omisell/.mcp.json > /dev/null
